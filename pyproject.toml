[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-tts-plugin-espeakng"
dynamic = ["version"]
description = "espeakNG tts plugin for mycroft"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "JarbasAi", email = "jarbasai@mailfence.com"}
]
keywords = ["mycroft", "OpenVoiceOS", "OVOS", "chatterbox", "plugin", "tts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Linguistic",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 2",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.0",
    "Programming Language :: Python :: 3.1",
    "Programming Language :: Python :: 3.2",
    "Programming Language :: Python :: 3.3",
    "Programming Language :: Python :: 3.4",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
]
dependencies = [
    "ovos-plugin-manager>=2.1.0,<3.0.0",
]

[project.optional-dependencies]
test = [
    "ovoscope[tts]",
    "pytest",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-tts-plugin-espeakNG"

[project.entry-points."opm.tts"]
"ovos-tts-plugin-espeakng" = "ovos_tts_plugin_espeakng:EspeakNGTTS"

[project.entry-points."opm.tts.config"]
"ovos-tts-plugin-espeakng.config" = "ovos_tts_plugin_espeakng:EspeakNGTTSPluginConfig"

[tool.setuptools.dynamic]
version = {attr = "ovos_tts_plugin_espeakng.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_tts_plugin_espeakng*"]
